<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Sparkefy">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9AE64A"/>
      <stop offset="45%" stop-color="#6DD400"/>
      <stop offset="100%" stop-color="#4CBB17"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Rounded square app-icon background (matches production AppIcon) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Soft highlight -->
  <ellipse cx="360" cy="300" rx="380" ry="280" fill="#C8F56A" opacity="0.35"/>
