  <g fill="#FFFFFF" filter="url(#glow)">
    <path d="M612 300c-28-48-78-78-148-78-92 0-158 48-172 128-8 44 8 82 48 108 28 18 68 32 138 48 52 12 78 26 88 48 12 28 2 56-32 74-42 22-96 18-138-10-28-18-46-42-54-72l-86 18c12 58 48 106 106 136 48 24 104 34 164 28 98-10 166-62 182-140 12-56-4-104-50-140-32-26-78-44-148-60-48-12-72-24-80-42-8-20-2-40 20-54 30-20 72-18 112 6 22 14 38 34 46 58l84-20c-12-48-40-90-80-128z"/>
  </g>
  <!-- Sparkles around the S -->
  <g fill="#FFFFFF">
    <path d="M290 360l18 48 48 18-48 18-18 48-18-48-48-18 48-18z" opacity="0.95"/>
    <path d="M700 280l14 36 36 14-36 14-14 36-14-36-36-14 36-14z" opacity="0.9"/>
    <path d="M740 420l10 26 26 10-26 10-10 26-10-26-26-10 26-10z" opacity="0.85"/>
    <path d="M320 560l12 32 32 12-32 12-12 32-12-32-32-12 32-12z" opacity="0.9"/>
    <path d="M680 620l16 42 42 16-42 16-16 42-16-42-42-16 42-16z" opacity="0.95"/>
    <path d="M420 250l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" opacity="0.8"/>
    <path d="M560 720l9 24 24 9-24 9-9 24-9-24-24-9 24-9z" opacity="0.85"/>
    <circle cx="640" cy="340" r="6" opacity="0.9"/>
    <circle cx="380" cy="480" r="4" opacity="0.75"/>
    <circle cx="720" cy="520" r="5" opacity="0.8"/>
    <circle cx="480" cy="680" r="4" opacity="0.7"/>
  </g>
  <!-- Starburst upper-right of S -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="620" y1="300" x2="780" y2="200"/>
    <line x1="640" y1="280" x2="760" y2="160"/>
    <line x1="650" y1="320" x2="800" y2="280"/>
